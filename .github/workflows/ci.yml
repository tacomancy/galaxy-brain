name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Prepare validation diagnostics
        run: mkdir -p test-results coverage

      - name: Run verification gate
        run: |
          bash tools/run-ci-command.sh \
            "$RUNNER_TEMP/galaxy-brain-validation.log" \
            npm run check

      - name: Generate validation coverage diagnostics
        if: always()
        continue-on-error: true
        run: |
          bash tools/run-ci-command.sh \
            "$RUNNER_TEMP/galaxy-brain-validation-coverage.log" \
            npm run test:coverage

      - name: Summarize validation diagnostics
        if: always()
        run: |
          {
            echo "## Validation diagnostics"
            for log in \
              "$RUNNER_TEMP/galaxy-brain-validation.log" \
              "$RUNNER_TEMP/galaxy-brain-validation-coverage.log"; do
              if [ -s "$log" ]; then
                grep -E "Test Files|Tests|Coverage|threshold|failed|passed" "$log" \
                  | tail -n 40 || true
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-diagnostics
          path: |
            app/test-results/junit.xml
            app/coverage/lcov.info
            app/coverage/coverage-final.json
          if-no-files-found: ignore
          retention-days: 14

  complexity:
    name: Complexity limits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Run complexity limits
        run: npm run lint:complexity

  documentation-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Test documentation checker
        run: npm run test:docs

      - name: Check authored documentation
        run: npm run docs:check

  desktop-workflow:
    name: Run desktop workflow tests
    runs-on: macos-latest
    env:
      GALAXY_BRAIN_WDIO_ARTIFACT_DIR: ${{ github.workspace }}/app/.ci-artifacts/desktop-workflow
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Prepare desktop diagnostics
        run: mkdir -p "$GALAXY_BRAIN_WDIO_ARTIFACT_DIR"

      - name: Run desktop workflow tests
        run: |
          bash tools/run-ci-command.sh \
            "$GALAXY_BRAIN_WDIO_ARTIFACT_DIR/runner.log" \
            npm run test:workflow

      - name: Verify developer-only release artifact
        run: |
          bash tools/run-ci-command.sh \
            "$GALAXY_BRAIN_WDIO_ARTIFACT_DIR/release-manifest.log" \
            npm run release:manifest
          bash tools/run-ci-command.sh \
            "$GALAXY_BRAIN_WDIO_ARTIFACT_DIR/release-verification.log" \
            npm run release:verify

      - name: Upload desktop workflow diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-workflow-diagnostics
          path: app/.ci-artifacts/desktop-workflow/
          if-no-files-found: ignore
          retention-days: 14
