name: Documentation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-documentation:
    name: Validate public documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation tools
        run: python -m pip install --requirement requirements-docs.txt

      - name: Build and validate public documentation
        run: python scripts/test_public_docs.py
