<!doctype html>
<!-- Three knowledge-workbench variants, switchable via ?variant=, on a standalone throwaway prototype route. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxy Brain — Workbench Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18201d;
        --muted: #68716c;
        --paper: #f7f4ec;
        --panel: #fffdf8;
        --line: #d9d5c9;
        --moss: #47695b;
        --sage: #dfe9df;
        --amber: #c17a38;
        --amber-soft: #f6e2c7;
        --blue: #315f7d;
        --blue-soft: #dcebf1;
        --violet: #69507e;
        --violet-soft: #e9e0ef;
        --rose: #984f53;
        --rose-soft: #f2dcda;
        --shadow: 0 18px 50px rgba(33, 44, 39, 0.12);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      button, input { font: inherit; }
      button { color: inherit; }
      .prototype { height: 100vh; }
      .hidden { display: none !important; }
      .eyebrow {
        color: var(--muted);
        font-size: 11px;
        font-weight: 760;
        letter-spacing: .11em;
        text-transform: uppercase;
      }
      .muted { color: var(--muted); }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255,255,255,.72);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      .pill::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--moss);
        content: "";
      }
      .icon-button {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        cursor: pointer;
      }
      .icon-button:hover { border-color: var(--moss); background: var(--sage); }
      .section-title { margin: 0; font-family: Georgia, serif; font-weight: 500; }
      .kicker { color: var(--moss); font-weight: 750; }
      .tag { color: var(--blue); font-size: 12px; font-weight: 720; }
      .state-chip {
        position: fixed;
        top: 12px;
        right: 14px;
        z-index: 20;
        padding: 7px 10px;
        border: 1px solid rgba(255,255,255,.38);
        border-radius: 8px;
        background: rgba(26,32,29,.84);
        color: #f7f4ec;
        font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        backdrop-filter: blur(9px);
      }

      /* Variant A — editor-first research studio */
      .studio {
        display: grid;
        grid-template-columns: 244px minmax(480px, 1fr) 290px;
        height: 100%;
        background: #efede5;
      }
      .studio-sidebar {
        display: flex;
        min-width: 0;
        flex-direction: column;
        border-right: 1px solid #d6d2c7;
        background: #e8e6de;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 58px;
        padding: 0 15px;
        border-bottom: 1px solid #d6d2c7;
        font-family: Georgia, serif;
        font-size: 17px;
      }
      .brain-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 9px;
        background: var(--moss);
        color: white;
        font-family: ui-sans-serif;
        font-size: 15px;
      }
      .sidebar-search { padding: 12px; }
      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid #cec9bc;
        border-radius: 8px;
        background: rgba(255,255,255,.64);
        color: var(--muted);
        font-size: 12px;
      }
      .search-box input {
        min-width: 0;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
      }
      .tree { flex: 1; overflow: auto; padding: 4px 8px 90px; }
      .tree-label { padding: 12px 9px 5px; }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 7px;
        color: #444c48;
        font-size: 12px;
        cursor: pointer;
      }
      .tree-row:hover, .tree-row.active { background: rgba(255,255,255,.72); color: var(--ink); }
      .tree-row.active { box-shadow: inset 3px 0 var(--moss); }
      .tree-row.indent { padding-left: 25px; }
      .tree-count { margin-left: auto; color: #858c87; font-size: 10px; }
      .studio-editor { display: flex; min-width: 0; flex-direction: column; background: var(--panel); }
      .editor-topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 58px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .breadcrumb { min-width: 0; color: var(--muted); font-size: 12px; }
      .breadcrumb strong { color: var(--ink); }
      .editor-actions { display: flex; gap: 7px; margin-left: auto; }
      .mode-button {
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .mode-button.active { border-color: #9bb5a8; background: var(--sage); color: #294a3b; }
      .editor-scroll { flex: 1; overflow: auto; }
      .editor-page {
        position: relative;
        max-width: 810px;
        min-height: 100%;
        margin: 0 auto;
        padding: 55px 64px 120px;
        outline: 0;
      }
      .editor-page h1 { margin: 8px 0 10px; font: 500 38px/1.12 Georgia, serif; }
      .editor-page h2 { margin: 34px 0 10px; font: 500 24px/1.2 Georgia, serif; }
      .editor-page p { font: 16px/1.72 Georgia, serif; }
      .editor-page mark { padding: 1px 3px; background: #f4dda1; }
      .frontmatter-line { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 24px; }
      .callout {
        margin: 24px 0;
        padding: 14px 16px;
        border-left: 4px solid var(--blue);
        border-radius: 0 9px 9px 0;
        background: var(--blue-soft);
      }
      .callout strong { display: block; margin-bottom: 5px; color: var(--blue); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
      .equation {
        margin: 24px 0;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfaf5;
        text-align: center;
        font: italic 20px Georgia, serif;
      }
      .link-token { padding: 2px 4px; border-radius: 4px; background: var(--violet-soft); color: var(--violet); font-family: ui-monospace, monospace; font-size: .88em; }
      .completion-popover {
        position: absolute;
        top: 355px;
        left: 315px;
        z-index: 4;
        width: 350px;
        overflow: hidden;
        border: 1px solid #c9c5b8;
        border-radius: 12px;
        background: white;
        box-shadow: var(--shadow);
      }
      .completion-head { padding: 9px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      .completion-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 9px; padding: 10px 12px; align-items: center; }
      .completion-item.selected { background: var(--sage); }
      .completion-icon { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 7px; background: #eeeae0; color: var(--moss); font-weight: 800; }
      .completion-title { font-size: 12px; font-weight: 760; }
      .completion-path { color: var(--muted); font-size: 10px; }
      .completion-kind { color: var(--muted); font-size: 9px; text-transform: uppercase; }
      .studio-inspector { min-width: 0; overflow: auto; border-left: 1px solid var(--line); background: #f2f0e9; padding: 18px 16px 100px; }
      .inspector-section { margin-bottom: 24px; }
      .inspector-heading { display: flex; align-items: center; margin-bottom: 9px; }
      .inspector-heading span { margin-left: auto; color: var(--muted); font-size: 10px; }
      .mini-card { margin-bottom: 8px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.72); }
      .mini-card strong { display: block; margin-bottom: 3px; font-size: 11px; }
      .mini-card p { margin: 0; color: var(--muted); font: 11px/1.45 Georgia, serif; }
      .metadata-grid { display: grid; grid-template-columns: 76px 1fr; gap: 8px; font-size: 11px; }
      .metadata-grid dt { color: var(--muted); }
      .metadata-grid dd { margin: 0; font-weight: 650; }

      /* Variant B — dashboard-first knowledge atlas */
      .atlas { height: 100%; overflow: auto; background: #edf1ed; padding-bottom: 100px; }
      .atlas-header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: 230px 1fr 230px;
        align-items: center;
        min-height: 70px;
        padding: 0 28px;
        border-bottom: 1px solid rgba(71,105,91,.18);
        background: rgba(247,250,247,.9);
        backdrop-filter: blur(16px);
      }
      .atlas-logo { font: 500 19px Georgia, serif; }
      .atlas-search {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 680px;
        width: 100%;
        margin: auto;
        padding: 11px 15px;
        border: 1px solid #c7d2ca;
        border-radius: 12px;
        background: white;
        box-shadow: 0 5px 18px rgba(49,70,60,.06);
      }
      .atlas-search input { width: 100%; border: 0; outline: 0; background: transparent; }
      .atlas-actions { display: flex; justify-content: flex-end; gap: 8px; }
      .atlas-main { max-width: 1300px; margin: 0 auto; padding: 38px 28px; }
      .atlas-welcome { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 26px; }
      .atlas-welcome h1 { margin: 5px 0 0; font: 500 36px/1.1 Georgia, serif; }
      .atlas-welcome .date { margin-left: auto; color: var(--muted); font-size: 12px; }
      .atlas-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
      .atlas-card { border: 1px solid #cfdbd2; border-radius: 16px; background: rgba(255,255,255,.82); box-shadow: 0 7px 25px rgba(48,71,61,.05); }
      .atlas-card-header { display: flex; align-items: center; padding: 16px 17px 10px; }
      .atlas-card-header h2 { margin: 0; font: 500 16px Georgia, serif; }
      .atlas-card-header button { margin-left: auto; border: 0; background: transparent; color: var(--moss); font-size: 11px; font-weight: 750; cursor: pointer; }
      .focus-card { grid-column: span 5; min-height: 250px; padding: 20px; background: #244b3e; color: #f5f8f5; }
      .focus-card .eyebrow { color: #b7d1c5; }
      .focus-card h2 { max-width: 390px; margin: 13px 0 10px; font: 500 27px/1.18 Georgia, serif; }
      .focus-card p { max-width: 430px; color: #c8d9d1; font: 14px/1.55 Georgia, serif; }
      .focus-progress { margin-top: 23px; height: 7px; overflow: hidden; border-radius: 9px; background: rgba(255,255,255,.18); }
      .focus-progress span { display: block; width: 64%; height: 100%; background: #d9bb73; }
      .focus-footer { display: flex; align-items: center; margin-top: 9px; color: #b7d1c5; font-size: 10px; }
      .focus-footer strong { margin-left: auto; color: white; }
      .map-card { grid-column: span 7; min-height: 250px; overflow: hidden; }
      .map-canvas { position: relative; height: 198px; background-image: radial-gradient(#cbd7ce 1px, transparent 1px); background-size: 18px 18px; }
      .map-line { position: absolute; height: 2px; transform-origin: left; background: #bdc9c1; }
      .node { position: absolute; padding: 7px 10px; border: 1px solid #aebfb3; border-radius: 9px; background: white; box-shadow: 0 5px 16px rgba(45,67,58,.08); font-size: 10px; font-weight: 750; }
      .node.primary { border-color: var(--moss); background: var(--sage); color: #28493b; }
      .metrics-card { grid-column: span 4; min-height: 190px; }
      .metric-row { display: grid; grid-template-columns: 1fr auto; gap: 4px; padding: 10px 17px; border-top: 1px solid #e2e8e3; }
      .metric-row strong { font: 500 25px Georgia, serif; }
      .metric-row span { grid-column: 1 / -1; color: var(--muted); font-size: 10px; }
      .question-card { grid-column: span 4; min-height: 190px; }
      .question-list { padding: 0 14px 13px; }
      .question-item { display: flex; gap: 9px; padding: 9px 4px; border-top: 1px solid #e2e8e3; font: 12px/1.35 Georgia, serif; }
      .question-dot { width: 7px; height: 7px; flex: 0 0 auto; margin-top: 5px; border-radius: 50%; background: var(--amber); }
      .proposal-card { grid-column: span 4; min-height: 190px; }
      .proposal-entry { margin: 0 14px 12px; padding: 12px; border: 1px solid #dbcbb8; border-radius: 10px; background: #fff9ef; }
      .proposal-entry strong { display: block; margin-bottom: 5px; font-size: 12px; }
      .proposal-entry p { margin: 0 0 9px; color: var(--muted); font-size: 10px; }
      .proposal-buttons { display: flex; gap: 6px; }
      .proposal-buttons button { padding: 6px 8px; border: 1px solid #d1c2ae; border-radius: 6px; background: white; font-size: 9px; font-weight: 750; cursor: pointer; }
      .proposal-buttons .review { border-color: var(--amber); background: var(--amber-soft); color: #75441d; }
      .timeline-card { grid-column: span 8; min-height: 220px; }
      .timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 8px 17px 17px; }
      .timeline-entry { position: relative; min-height: 132px; padding: 13px; border: 1px solid #dce3dd; border-radius: 11px; background: #fbfcfa; }
      .timeline-entry .time { color: var(--muted); font-size: 9px; }
      .timeline-entry strong { display: block; margin: 8px 0 5px; font: 500 13px Georgia, serif; }
      .timeline-entry p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.4; }

      /* Variant C — source-first paper desk */
      .paper-desk { display: grid; grid-template-rows: 54px 1fr 112px; height: 100%; background: #272a29; color: #eee9dd; }
      .desk-topbar { display: grid; grid-template-columns: 280px 1fr 280px; align-items: center; border-bottom: 1px solid #434745; background: #303432; padding: 0 15px; }
      .desk-brand { font: 500 16px Georgia, serif; }
      .desk-document { justify-self: center; color: #d3cec2; font-size: 11px; }
      .desk-actions { display: flex; justify-content: flex-end; gap: 7px; }
      .desk-button { padding: 6px 9px; border: 1px solid #555a57; border-radius: 7px; background: #383d3a; color: #e8e3d8; font-size: 10px; cursor: pointer; }
      .desk-main { display: grid; min-height: 0; grid-template-columns: minmax(500px, 1.35fr) minmax(420px, .9fr); }
      .pdf-pane { display: grid; grid-template-columns: 54px 1fr; min-width: 0; border-right: 1px solid #444846; background: #3a3e3c; }
      .pdf-toolbar { display: flex; flex-direction: column; align-items: center; gap: 9px; padding-top: 14px; border-right: 1px solid #4b504d; }
      .pdf-tool { display: grid; width: 31px; height: 31px; place-items: center; border: 0; border-radius: 7px; background: transparent; color: #c4c5bf; cursor: pointer; }
      .pdf-tool.active, .pdf-tool:hover { background: #555b57; color: white; }
      .pdf-stage { overflow: auto; padding: 26px; }
      .paper-page { position: relative; max-width: 720px; min-height: 900px; margin: 0 auto; padding: 58px 70px; background: #fffef9; color: #202420; box-shadow: 0 20px 50px rgba(0,0,0,.24); font-family: Georgia, serif; }
      .paper-page h1 { margin: 0 0 11px; text-align: center; font-size: 25px; font-weight: 500; }
      .paper-authors { margin-bottom: 34px; text-align: center; color: #59615d; font-size: 11px; }
      .paper-page h2 { margin: 24px 0 9px; font-size: 16px; }
      .paper-page p { margin: 0 0 13px; font-size: 12px; line-height: 1.62; text-align: justify; }
      .paper-page .paper-equation { margin: 21px 0; text-align: center; font-size: 17px; font-style: italic; }
      .pdf-highlight { background: #ffed96; box-shadow: 0 0 0 2px #ffed96; }
      .annotation-pin { position: absolute; right: 28px; top: 385px; display: grid; width: 24px; height: 24px; place-items: center; border-radius: 50%; background: var(--amber); color: white; font: 700 10px ui-sans-serif; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
      .notes-pane { display: flex; min-width: 0; flex-direction: column; background: #f6f2e8; color: var(--ink); }
      .notes-tabs { display: flex; min-height: 44px; border-bottom: 1px solid var(--line); }
      .notes-tab { flex: 1; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 10px; font-weight: 750; cursor: pointer; }
      .notes-tab.active { background: white; color: var(--ink); box-shadow: inset 0 -3px var(--amber); }
      .notes-content { flex: 1; overflow: auto; padding: 23px 25px 100px; }
      .source-meta { display: flex; gap: 7px; margin: 8px 0 18px; }
      .notes-content h1 { margin: 0; font: 500 25px Georgia, serif; }
      .notes-content h2 { margin: 26px 0 10px; font: 500 16px Georgia, serif; }
      .annotation-card { margin-bottom: 11px; padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: white; }
      .annotation-card .page-ref { color: var(--amber); font-size: 9px; font-weight: 800; text-transform: uppercase; }
      .annotation-card blockquote { margin: 7px 0; padding-left: 10px; border-left: 3px solid #e3cda9; color: #59615d; font: italic 12px/1.5 Georgia, serif; }
      .annotation-card p { margin: 7px 0 0; font-size: 11px; line-height: 1.45; }
      .evidence-ledger { margin-top: 18px; overflow: hidden; border: 1px solid #cfdbd2; border-radius: 10px; background: white; }
      .ledger-row { display: grid; grid-template-columns: 80px 1fr; gap: 10px; padding: 9px 11px; border-top: 1px solid #e5e7e2; font-size: 10px; }
      .ledger-row:first-child { border-top: 0; }
      .ledger-kind { color: var(--moss); font-weight: 800; }
      .source-strip { display: flex; gap: 10px; align-items: stretch; overflow-x: auto; padding: 12px 16px 30px; border-top: 1px solid #444846; background: #303432; }
      .source-strip-label { display: flex; width: 92px; flex: 0 0 auto; align-items: center; color: #aeb4b0; font-size: 10px; font-weight: 750; text-transform: uppercase; }
      .source-tile { width: 220px; flex: 0 0 auto; padding: 10px 12px; border: 1px solid #4d5350; border-radius: 9px; background: #393e3b; }
      .source-tile.active { border-color: #c99a62; background: #49453d; }
      .source-tile strong { display: block; margin-bottom: 5px; font: 500 12px Georgia, serif; }
      .source-tile span { color: #afb4b0; font-size: 9px; }

      /* Prototype switcher */
      .prototype-switcher {
        position: fixed;
        bottom: 16px;
        left: 50%;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px;
        transform: translateX(-50%);
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 999px;
        background: rgba(23,27,25,.94);
        color: white;
        box-shadow: 0 14px 40px rgba(0,0,0,.28);
        backdrop-filter: blur(14px);
      }
      .switch-arrow { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 50%; background: #343a37; color: white; cursor: pointer; }
      .switch-arrow:hover { background: #4b554f; }
      .switch-label { min-width: 228px; text-align: center; }
      .switch-label strong { display: block; font-size: 11px; }
      .switch-label span { display: block; margin-top: 1px; color: #abb4af; font-size: 9px; }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 78px;
        z-index: 90;
        padding: 9px 13px;
        transform: translateX(-50%) translateY(12px);
        border-radius: 8px;
        background: #18201d;
        color: white;
        font-size: 11px;
        opacity: 0;
        pointer-events: none;
        transition: .18s ease;
      }
      .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

      @media (max-width: 980px) {
        .studio { grid-template-columns: 205px 1fr; }
        .studio-inspector { display: none; }
        .atlas-header { grid-template-columns: 150px 1fr 100px; }
        .focus-card, .map-card { grid-column: span 12; }
        .metrics-card, .question-card, .proposal-card { grid-column: span 6; }
        .timeline-card { grid-column: span 12; }
        .desk-main { grid-template-columns: 1fr; }
        .pdf-pane { display: none; }
      }
    </style>
  </head>
  <body>
    <main id="app" class="prototype"></main>
    <div id="state" class="state-chip"></div>
    <div id="toast" class="toast"></div>
    <nav class="prototype-switcher" aria-label="Prototype variants">
      <button id="previous" class="switch-arrow" aria-label="Previous variant">←</button>
      <div class="switch-label">
        <strong id="variant-label"></strong>
        <span>Throwaway UI comparison · use ← →</span>
      </div>
      <button id="next" class="switch-arrow" aria-label="Next variant">→</button>
    </nav>

    <template id="variant-a">
      <section class="studio">
        <aside class="studio-sidebar">
          <div class="brand"><span class="brain-mark">GB</span> Galaxy Brain</div>
          <div class="sidebar-search"><label class="search-box">⌕ <input aria-label="Search knowledge" placeholder="Search everything…" /></label></div>
          <nav class="tree">
            <div class="tree-label eyebrow">Knowledge</div>
            <div class="tree-row">▾ <strong>Topics</strong><span class="tree-count">24</span></div>
            <div class="tree-row indent active">◈ Bayesian statistics</div>
            <div class="tree-row indent">◈ Probability theory</div>
            <div class="tree-row indent">◈ Causal inference</div>
            <div class="tree-row">▸ Decisions<span class="tree-count">6</span></div>
            <div class="tree-label eyebrow">Working space</div>
            <div class="tree-row">▸ Sources<span class="tree-count">83</span></div>

              <h1>Bayesian statistics</h1>
              <p>Bayesian statistics provides a framework for updating uncertainty as evidence arrives. It combines a prior model with observed data to produce a <span class="link-token">[[posterior probability]]</span>.</p>
              <div class="callout"><strong>Key idea</strong>Probability represents a state of information. The posterior makes assumptions and evidence explicit rather than hiding them inside a point estimate.</div>
              <h2>Bayes’ theorem</h2>
              <div class="equation">P(A | B) = P(B | A) P(A) / P(B)</div>
              <p>The denominator normalizes the result across competing explanations. This is <mark>easy to overlook when reasoning from diagnostic accuracy</mark>, where the base rate can dominate.</p>

                <h2>3.2.1 Scaled Dot-Product Attention</h2>
                <p>We call our particular attention “Scaled Dot-Product Attention.” The input consists of queries and keys of dimension d<sub>k</sub>, and values of dimension d<sub>v</sub>.</p>
                <p>We compute the dot products of the query with all keys, divide each by √d<sub>k</sub>, and apply a softmax function to obtain the weights on the values.</p>
                <div class="paper-equation">Attention(Q, K, V) = softmax(QKᵀ / √d<sub>k</sub>)V</div>
                <p><span class="pdf-highlight">We suspect that for large values of d<sub>k</sub>, the dot products grow large in magnitude, pushing the softmax function into regions where it has extremely small gradients.</span> To counteract this effect, we scale the dot products.</p>
                <span class="annotation-pin">3</span>
                <h2>3.2.2 Multi-Head Attention</h2>
                <p>Instead of performing a single attention function with d<sub>model</sub>-dimensional keys, values and queries, we found it beneficial to linearly project the queries, keys and values multiple times.</p>

    <script>
      const variants = [
        { key: "A", name: "Editor-first research studio" },
        { key: "B", name: "Dashboard-first knowledge atlas" },
        { key: "C", name: "Source-first paper desk" },
      ];
      const app = document.querySelector("#app");
      const label = document.querySelector("#variant-label");
      const state = document.querySelector("#state");
      const toast = document.querySelector("#toast");
      let toastTimer;

      function currentKey() {
        const candidate = new URLSearchParams(window.location.search).get("variant")?.toUpperCase();
        return variants.some((item) => item.key === candidate) ? candidate : "A";
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      function bindPrototypeInteractions() {
        document.querySelectorAll("[data-toast]").forEach((button) => {
          button.addEventListener("click", () => showToast(button.dataset.toast));
        });
        document.querySelectorAll(".notes-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            document.querySelectorAll(".notes-tab").forEach((item) => item.classList.remove("active"));
            tab.classList.add("active");
            showToast(`${tab.textContent} workspace selected`);
          });
        });
      }

      function render() {
        const key = currentKey();
        const variant = variants.find((item) => item.key === key);
        const template = document.querySelector(`#variant-${key.toLowerCase()}`);
        app.replaceChildren(template.content.cloneNode(true));
        label.textContent = `${variant.key} · ${variant.name}`;
        state.textContent = `variant=${variant.key} · persistence=memory · data=mock`;
        document.title = `${variant.name} — Galaxy Brain Prototype`;
        bindPrototypeInteractions();
      }

      function cycle(direction) {
        const index = variants.findIndex((item) => item.key === currentKey());
        const next = variants[(index + direction + variants.length) % variants.length];
        const url = new URL(window.location.href);
        url.searchParams.set("variant", next.key);
        window.history.replaceState({}, "", url);
        render();
      }

      document.querySelector("#previous").addEventListener("click", () => cycle(-1));
      document.querySelector("#next").addEventListener("click", () => cycle(1));
      window.addEventListener("popstate", render);
      window.addEventListener("keydown", (event) => {
        const target = event.target;
        if (target.matches("input, textarea, [contenteditable='true']")) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });

      render();
    </script>
