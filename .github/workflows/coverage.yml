name: Coverage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-limits:
    name: Coverage limits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Enforce coverage limits
        run: npm run test:coverage

      - name: Enforce changed-lines coverage
        run: >-
          npm run check:changed-coverage --
          --lcov coverage/lcov.info
          --base-ref "origin/${GITHUB_BASE_REF}"
          --head-ref HEAD
          --repository-root ..
          --coverage-root .
