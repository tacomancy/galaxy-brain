name: Workflow security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check immutable action references
        run: node scripts/check-workflow-security.mjs

      - name: Test immutable action reference checker
        run: node scripts/test-workflow-security.mjs

      - name: Validate workflow syntax with actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          files: ".github/workflows/*.yml"

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          min-confidence: high
          version: "1.29.0"
          inputs: .github/workflows
