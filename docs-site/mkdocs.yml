site_name: Galaxy Brain
site_description: The public project documentation for Galaxy Brain and its Knowledge Workbench.
site_url: https://tacomancy.github.io/galaxy-brain/
docs_dir: ../.generated/public-docs
site_dir: ../.generated/public-site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Application: application.md
  - Project documentation: project-documentation.md
  - Current capabilities: current-capabilities.md
  - Release notes: release-notes.md
  - Human-agent collaboration: agent-guidance.md
  - Tutorials:
      - Overview: tutorials/index.md
      - First launch: tutorials/first-run.md
      - Create a Knowledge Repository: tutorials/create-knowledge-repository.md
      - Open a Knowledge Repository: tutorials/open-knowledge-repository.md
      - Resume a Workbench session: tutorials/resume-workbench-session.md
      - Navigate among workspaces: tutorials/navigate-workspaces.md
      - Read a Source Record: tutorials/read-source-record.md
      - Prepare a Synthesis request: tutorials/prepare-synthesis-request.md
      - Confirm, decline, or cancel Synthesis: tutorials/confirm-synthesis-request.md
      - Understand saved Synthesis results: tutorials/understand-synthesis-results.md
      - Repository Format overview: tutorials/repository-format-overview.md
      - Safety and privacy: tutorials/safety-and-privacy.md
      - Troubleshoot common recovery states: tutorials/troubleshooting.md
  - Architecture:
      - V1 architecture: architecture/index.md
      - Architecture: architecture/architecture.md
      - Product decisions: architecture/product-decisions.md
      - Repository format: architecture/repository-format.md
      - Test strategy: architecture/test-strategy.md
  - Reference:
      - Engineering glossary: engineering-glossary.md
      - Domain glossary: domain-glossary.md
  - Security policy: security.md
