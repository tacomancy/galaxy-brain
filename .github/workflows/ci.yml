name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Run verification gate
        run: npm run check

  complexity:
    name: Complexity limits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Run complexity limits
        run: npm run lint:complexity

  documentation-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Test documentation checker
        run: npm run test:docs

      - name: Check authored documentation
        run: npm run docs:check

  desktop-workflow:
    name: Run desktop workflow tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-node

      - name: Run desktop workflow tests
        run: npm run test:workflow
