name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation tools
        run: python -m pip install --requirement requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build and validate public documentation
        run: python scripts/build_public_docs.py --output .generated/public-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .generated/public-site

  deploy:
    name: Deploy public documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
